name: nizvpn
description: Simple VPN using Platform Channel
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_analytics: ^11.4.0
  firebase_crashlytics: ^4.1.0
  google_fonts: ^6.2.1
  provider: ^6.4.0
  dio: ^5.6.0
  cached_network_image: ^3.2.3
  shimmer: ^3.0.1
  shared_preferences: ^2.4.3
  line_icons: ^2.0.0
  ndialog: ^4.2.0
  flutter_inapp_purchase: ^5.4.0
  admob_flutter: ^3.2.0
  in_app_update: ^4.1.0
  in_app_review: ^5.0.0
  package_info_plus: ^8.0.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.1
  device_info_plus: ^11.0.0
  google_mobile_ads: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: "launcher_icon"
  image_path: "assets/icons/logo.png"

flutter:
  uses-material-design: true
  assets:
    - "assets/images/"
    - "assets/icons/"
    - "assets/icons/flags/"
  fonts:
    - family: NerdVPNIcon
      fonts:
        - asset: assets/fonts/NerdVPNIcon.ttf
